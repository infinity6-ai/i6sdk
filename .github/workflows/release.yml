name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
    branches:
      - 'edge'

permissions:
  contents: write

jobs:
  build-sdks:
    name: Build SDKs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Build Tools
        run: |
          python3 -m pip install --upgrade pip build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update & Generate Code
        run: |
          ./build.sh work_init
          ./build.sh update 2>/dev/null || ./build.sh codegen

      # Python package builds
      - name: Build Python Edge Distribution
        if: github.ref_name == 'edge'
        run: |
          mkdir -p dist
          sed -i 's/version = .*/version = "0.0.0.dev0"/' sdkpy/pyproject.toml
          python3 -m build sdkpy -o dist/
          cp dist/*dev*.whl dist/i6sdk-edge-py3-none-any.whl
          cp dist/*dev*.tar.gz dist/i6sdk-edge.tar.gz

      - name: Build Python Tagged Distribution
        if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '/')
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/version = .*/version = \"${VERSION}\"/" sdkpy/pyproject.toml
          python3 -m build sdkpy -o dist/
          cp "dist/i6sdk-${VERSION}-py3-none-any.whl" dist/i6sdk-latest-py3-none-any.whl
          cp "dist/i6sdk-${VERSION}.tar.gz" dist/i6sdk-latest.tar.gz

      # Web package builds
      - name: Build Web Edge Distribution
        if: github.ref_name == 'edge'
        run: |
          mkdir -p dist
          sed -i 's/"version": .*/"version": "0.0.0-dev",/' sdkweb/package.json
          (cd sdkweb && ./build.sh bundle)
          tar -czf dist/i6sdk-web-edge.tar.gz -C sdkweb/dist .

      - name: Build Web Tagged Distribution
        if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '/')
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": .*/\"version\": \"${VERSION}\",/" sdkweb/package.json
          (cd sdkweb && ./build.sh bundle)
          tar -czf "dist/i6sdk-web-${VERSION}.tar.gz" -C sdkweb/dist .
          cp "dist/i6sdk-web-${VERSION}.tar.gz" dist/i6sdk-web-latest.tar.gz

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          retention-days: 1

      - name: Upload Web SDK Pages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdkweb-dist
          path: sdkweb/dist/
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [build-sdks]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release-assets

      - name: Download Web SDK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdkweb-dist
          path: sdkweb-dist

      # -----------------------------------------------------------------
      # Case 1: Push to 'edge' branch -> Update in-place pre-release
      # -----------------------------------------------------------------
      - name: Update 'edge' Pre-Release In-Place
        if: github.ref_name == 'edge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete edge --yes --cleanup-tag 2>/dev/null || true
          gh release create edge release-assets/* \
            --target "${{ github.sha }}" \
            --title "Edge Development Build" \
            --notes "Continuous multi-language build updated on every push to the edge branch. Commit: ${{ github.sha }}" \
            --prerelease

      # -----------------------------------------------------------------
      # Case 2: Tagged Release (vX.Y.Z) -> Publish Official Release
      # -----------------------------------------------------------------
      - name: Publish Tagged GitHub Release
        if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes

      # -----------------------------------------------------------------
      # Case 3: Deploy sdkweb with Directory Listings to GitHub Pages
      # -----------------------------------------------------------------
      - name: Sync Existing GitHub Pages Content
        run: |
          mkdir -p gh-pages-staging
          git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git archive origin/gh-pages | tar -x -C gh-pages-staging 2>/dev/null || true
          fi

      - name: Prepare Edge Web SDK for GitHub Pages
        if: github.ref_name == 'edge'
        run: |
          mkdir -p gh-pages-staging/release/sdkweb/edge
          rm -rf gh-pages-staging/release/sdkweb/edge/*
          cp -r sdkweb-dist/* gh-pages-staging/release/sdkweb/edge/

      - name: Prepare Tagged Web SDK for GitHub Pages
        if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '/')
        run: |
          mkdir -p "gh-pages-staging/release/sdkweb/${GITHUB_REF_NAME}"
          mkdir -p gh-pages-staging/release/sdkweb/latest
          rm -rf "gh-pages-staging/release/sdkweb/${GITHUB_REF_NAME}/*"
          rm -rf gh-pages-staging/release/sdkweb/latest/*
          cp -r sdkweb-dist/* "gh-pages-staging/release/sdkweb/${GITHUB_REF_NAME}/"
          cp -r sdkweb-dist/* gh-pages-staging/release/sdkweb/latest/

      - name: Generate Static Directory Listings (index.html)
        run: |
          python3 .github/scripts/generate_indexes.py gh-pages-staging

      - name: Deploy Web SDK to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-staging
          cname: sdk.lp.infinity6.ai
          force_orphan: true
