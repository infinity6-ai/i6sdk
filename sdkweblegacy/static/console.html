<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I6 Sdk Web</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://datasetmanager.staging.rs.infinity6.ai/static/i6web/core/js/jquery.js"></script>
    <style>
        :root {
            --bg: #f4f5f9;
            --card: #ffffff;
            --text: #1c2033;
            --muted: #6b7189;
            --border: #dfe2ec;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --accent-soft: #eef0ff;
            --err: #b91c1c;
            --warn: #a16207;
            --shadow: 0 1px 2px rgba(20, 24, 50, .06), 0 8px 24px rgba(20, 24, 50, .06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1120;
                --card: #181b2e;
                --text: #e8eaf6;
                --muted: #949ab8;
                --border: #2b2f4a;
                --accent: #7c83ff;
                --accent-hover: #939aff;
                --accent-soft: #23274a;
                --err: #f87171;
                --warn: #facc15;
                --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 48px 16px;
        }

        #wrapper { width: 100%; max-width: 1280px; }

        header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }

        header img { width: 40px; height: 40px; border-radius: 10px; }

        h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }

        header p { margin: 0; color: var(--muted); font-size: 13px; }

        #login { margin-left: auto; }

        #console-log {
            height: calc(100vh - 250px);
            min-height: 240px;
            overflow: auto;
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--bg);
            font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        #console-log:empty::before { content: "No output yet"; color: var(--muted); }

        #console-log .line { white-space: pre-wrap; word-break: break-word; }
        #console-log .time { color: var(--muted); margin-right: 8px; }
        #console-log .warn { color: var(--warn); }
        #console-log .error { color: var(--err); }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 24px;
        }

        h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            margin: 0 0 16px;
        }

        form { display: flex; flex-direction: column; gap: 16px; }

        .field { display: flex; flex-direction: column; gap: 6px; }

        .field > span { font-size: 13px; font-weight: 600; }

        input[type=file] {
            width: 100%;
            padding: 10px;
            color: var(--muted);
            background: var(--bg);
            border: 1.5px dashed var(--border);
            border-radius: 10px;
            font: inherit;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        input[type=file]:hover,
        input[type=file]:focus-visible {
            border-color: var(--accent);
            background: var(--accent-soft);
            outline: none;
        }

        input[type=file]::file-selector-button {
            margin-right: 12px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(300px, 400px) 1fr;
            gap: 16px;
            align-items: start;
        }

        .card-actions { display: flex; align-items: center; gap: 8px; }

        a.link {
            padding: 4px 10px;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        a.link:hover { background: var(--accent-soft); color: var(--text); }

        #tests {
            margin-top: 16px;
        }

        #tests iframe {
            display: block;
            width: 100%;
            height: 640px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
        }

        @media (max-width: 800px) {
            .grid { grid-template-columns: 1fr; }
            #console-log { height: 320px; }
        }

        .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }

        .card-head h2 { margin: 0; }

        button.link {
            padding: 4px 10px;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            font-size: 13px;
        }

        button.link:hover { background: var(--accent-soft); color: var(--text); }

        button {
            align-self: flex-start;
            padding: 10px 22px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, transform .05s;
        }

        button:hover { background: var(--accent-hover); }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
        button:disabled { opacity: .55; cursor: progress; }

    </style>
</head>

<body>
    <div id="wrapper">
        <header>
            <img src="favicon.png" alt="">
            <div>
                <h1>I6 SDK Web</h1>
                <p>API test console</p>
            </div>
            <button id="login" type="button">Login</button>
        </header>

        <div class="grid">
            <section class="card">
                <h2>Ingest upload</h2>
                <form>
                    <label class="field">
                        <span>File</span>
                        <input type="file" />
                    </label>
                    <button type="submit">Submit</button>
                </form>
            </section>

            <section class="card">
                <div class="card-head">
                    <h2>Console</h2>
                    <button id="console-clear" class="link" type="button">Clear</button>
                </div>
                <div id="console-log"></div>
            </section>
        </div>

        <section class="card" id="tests">
            <div class="card-head">
                <h2>Tests</h2>
                <div class="card-actions">
                    <button id="tests-reload" class="link" type="button">Reload</button>
                    <a class="link" href="test.html" target="_blank" rel="noopener">Open in new tab</a>
                </div>
            </div>
            <iframe src="test.html" title="Tests"></iframe>
        </section>
    </div>

    <script src="console.js"></script>
    <script>
        document.getElementById("tests-reload").addEventListener("click", () => {
            document.querySelector("#tests iframe").contentWindow.location.reload()
        })
    </script>

    <script type="module" src="index.js"></script>

</body>

</html>
