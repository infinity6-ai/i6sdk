<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I6 Sdk Web</title>
    <script src="https://datasetmanager.staging.rs.infinity6.ai/static/i6web/core/js/jquery.js"></script>
</head>

<body>
    <div id="wrapper">
        <h1>I6 SDK Web</h1>
        <p id="output">loading...</p>

        <form>
            <input type="file" />
            <br>
            <input type="file" />
            <button type="submit">Submit</button>
        </form>
    </div>

    <script type="module">
        import { I6Sdk } from '../src/index.js'

        const i6sdk = new I6Sdk()
        document.getElementById('output').textContent = i6sdk.hello()
        let ingestz = await i6sdk.ingestz()
        


        $(window).ready(async () => {
            const form = $("form")

            $(form).submit(() => {
                ingestz.upload({ subscription: "sub", store: "stor", inputfile: form.find("[type=file]")[0] })
                    .then(() => console.log("Upload succeeded"))
                    .catch((err) => console.error("Upload failed", err))
                return false
            })
        })
    </script>
</body>

</html>
